<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELORA | Catálogo BMW M</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="social-rail">
  <a href="#" aria-label="Instagram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
  <a href="#" aria-label="YouTube"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l6 3-6 3z" fill="white" stroke="none"/></svg></a>
  <a href="#" aria-label="Facebook"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><path d="M15 8h-2a2 2 0 0 0-2 2v10M9 13h6"/></svg></a>
</div>

<header class="navbar">
  <a href="index.html" class="navbar__logo">
    <svg width="26" height="26" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="19" stroke="white" stroke-width="1.5"/>
      <path d="M12 26L20 12L28 26" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <span>VELORA</span>
  </a>
  <nav class="navbar__links">
    <a href="index.html">Inicio</a>
    <a href="modelos.html" class="active">Modelos</a>
    <a href="carrito.html">Carrito <span id="cart-count" class="cart-count"></span></a>
  </nav>
  <div class="navbar__right">
    <a href="#" id="auth-link" class="auth-link"></a>
    <a href="carrito.html" class="btn btn--light">Ir al carrito <span>&rarr;</span></a>
    <button class="hamburger" aria-label="Menú">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
  </div>
</header>

<main class="page">
  <section class="page__header">
    <h1>Catálogo BMW M</h1>
    <p>Cada auto aquí es una experiencia. Encuentra el tuyo hoy mismo.</p>
  </section>

  <section class="grid" id="models-grid"></section>
</main>

<footer class="footer">
  <p>&copy; 2026 VELORA · BMW M Division. Todos los derechos reservados.</p>
</footer>

<div id="login-modal" class="modal-overlay">
  <div class="modal">
    <button class="modal__close" data-close-modal>✕</button>
    <h2 id="auth-title">Iniciar sesión</h2>
    <form id="auth-form">
      <div id="auth-name-field" class="field" style="display:none;">
        <label>Nombre</label>
        <input type="text" id="auth-name" placeholder="Tu nombre">
      </div>
      <div class="field">
        <label>Correo</label>
        <input type="email" id="auth-email" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="auth-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn--light btn--full">Entrar</button>
      <p class="auth-switch">
        <span id="auth-switch-text">¿No tienes cuenta?</span>
        <a href="#" id="auth-switch-link">Regístrate</a>
      </p>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/main.js"></script>
</body>
</html>
